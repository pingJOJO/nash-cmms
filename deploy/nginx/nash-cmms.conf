# ==============================================================================
# NASH CMMS - Production Nginx Reverse Proxy & Static Caching Configuration
# Target Path on Ubuntu: /etc/nginx/sites-available/nash-cmms
# Symlink Target:        /etc/nginx/sites-enabled/nash-cmms
# ==============================================================================

upstream nash_node_backend {
    server 127.0.0.1:3010;
    keepalive 64;
}

server {
    server_name nexcmms.online www.nexcmms.online 13.60.36.206;

    root /var/www/nash-cmms/dist;
    index index.html;

    # Maximum file upload size (for work order attachments and asset images)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # GZIP COMPRESSION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # STATIC ASSETS CACHING (Vite Bundled CSS/JS/Images)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # REST API REVERSE PROXY (Forward to Express / Node.js on port 3010)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://nash_node_backend;
        proxy_http_version 1.1;
        
        # WebSocket & Keep-Alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # IP & Protocol Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Operational Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # UPLOADED ATTACHMENTS & PHOTOS (Work order pictures, receipts)
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/nash-cmms/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # CLIENT-SIDE SPA ROUTING (Fallback to index.html for React Router)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # ERROR HANDLING
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nexcmms.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nexcmms.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.nexcmms.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = nexcmms.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name nexcmms.online www.nexcmms.online 13.60.36.206;
    return 404; # managed by Certbot
}
